# Releve horaire des zones actives sur la France, publie sur GitHub Pages.
# Le site contient la page interactive (index.html), le dernier releve (latest.json) et les 24 derniers releves.
# Si le releve echoue ou est incomplet, rien n'est publie : la version en ligne reste la precedente.
name: Releve horaire

on:
  # Declenchement principal : cron-job.org appelle workflow_dispatch toutes les heures a hh:05.
  # Secours : la programmation de GitHub (souvent retardee ou sautee) a hh:37. Un releve porte le nom de son heure
  # (AAAA-MM-JJTHHZ.json) : deux releves d'une meme heure se remplacent, 24 releves = 24 heures.
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:             # cron-job.org, ou bouton « Run workflow » dans l'onglet Actions
  # Envoi de code : nouveau releve si le calcul des zones change (scripts, complements, dependances, cette Action),
  # sinon (page ou mode d'emploi seulement) republication des pages avec le releve deja en ligne, sans interroger SOFIA.
  push:
    branches: [main]
    paths: ["*.py", "carte_template.html", "MODE_EMPLOI.md", "zones_complements.txt", "requirements.txt",
            ".github/workflows/releve.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: releve
  cancel-in-progress: false

jobs:
  releve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0         # historique complet : comparaison avec le commit precedent l'envoi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # PDF des SUP AIP et bases OpenAir deja telecharges (evite de tout retelecharger chaque heure)
      - uses: actions/cache@v4
        with:
          path: cache
          key: cache-${{ github.run_id }}
          restore-keys: cache-

      - name: Releves precedents (depuis le site en ligne)
        run: |
          mkdir -p site
          base="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}"
          if curl -fsSL "$base/index.json" -o site/index.json; then
            for f in $(jq -r '.releves[]' site/index.json); do
              curl -fsSL "$base/$f" -o "site/$f" || echo "absent : $f"
            done
            curl -fsSL "$base/latest.json" -o site/latest.json || rm -f site/latest.json
          else
            echo "Pas encore de site en ligne : premier releve."
          fi
          ls site

      # Releve SOFIA, sauf pour un envoi qui ne modifie que les pages (pages.py, carte_template.html, MODE_EMPLOI.md) :
      # republication seule. pages.py ne contient que la generation des pages, pas le calcul des zones.
      - name: Nature du declenchement
        id: mode
        run: |
          releve=true
          if [ "${{ github.event_name }}" = "push" ] && [ -f site/latest.json ]; then
            before="${{ github.event.before }}"
            if git cat-file -e "$before^{commit}" 2>/dev/null; then
              changes=$(git diff --name-only "$before" "${{ github.sha }}")
              echo "Fichiers modifies :"; echo "$changes"
              if ! echo "$changes" | grep -v '^pages\.py$' | grep -qE '\.py$|^zones_complements\.txt$|^requirements\.txt$|^\.github/workflows/'; then
                releve=false
              fi
            fi
          fi
          echo "releve=$releve" >> "$GITHUB_OUTPUT"
          echo "Nouveau releve SOFIA : $releve"

      - name: Releve France
        if: steps.mode.outputs.releve == 'true'
        run: python releve_france.py --dossier site

      - name: Republication de la page (sans releve)
        if: steps.mode.outputs.releve != 'true'
        run: python releve_france.py --dossier site --republier

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
